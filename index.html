<!doctype html>
<html lang="en">
<head>

  <script>(function(){var t=localStorage.getItem("candlelit-theme")||"system";var d=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";document.documentElement.dataset.palette=localStorage.getItem("candlelit-palette")||"blush";})();</script>
